    <!-- Blocking dark-mode script: runs before first paint to prevent flash -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        safelist: [
          'dark:bg-gray-900', 'dark:bg-gray-800', 'dark:bg-gray-700', 'dark:bg-gray-600',
          'dark:border-gray-700', 'dark:text-white', 'dark:text-gray-100', 'dark:text-gray-200',
          'dark:text-gray-400', 'dark:hover:bg-gray-600', 'dark:placeholder-gray-500',
          'dark:bg-gray-900\\/60',

        theme: {

                700: '#344054',

              },
              ink: '#101828',

            },

            },

    <style>
      html { scroll-padding-top: 96px; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #FCFCFD;
        color: #101828;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .dark body { background-color: #0b0916; color: #f4f5fa; }
      .font-display { font-family: 'Montserrat', 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #2b2840; }

      /* Subtle static ambient glow — pure CSS, no animation loop */
      .ambient-glow {
        position: absolute;
        border-radius: 9999px;
        filter: blur(80px);
        pointer-events: none;
        background: radial-gradient(closest-side, rgba(124, 58, 237, 0.07), transparent);
      }
      .dark .ambient-glow {
        background: radial-gradient(closest-side, rgba(139, 92, 246, 0.10), transparent);
      }

      /* ── Apple-style glassmorphism system ── */

      /* Colorful gradient mesh behind everything — makes glass read as glass */
      .mesh-blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        pointer-events: none;
        will-change: transform;
        animation: mesh-drift 26s ease-in-out infinite alternate;
      }
      @keyframes mesh-drift {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(40px, -30px, 0) scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mesh-blob { animation: none; }
      }
      /* Static mesh on small screens — animating blurred layers is expensive on mobile GPUs */
      @media (max-width: 640px) {
        .mesh-blob { animation: none; }
      }

      /* Frosted glass card */
      .glass {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 1px 2px rgba(16, 24, 40, 0.04),
          0 12px 32px -8px rgba(16, 24, 40, 0.10),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .dark .glass {
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          0 12px 32px -8px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }

      /* Stronger glass for hero/featured panels */
      .glass-strong {
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow:
          0 1px 2px rgba(16, 24, 40, 0.05),
          0 24px 48px -12px rgba(16, 24, 40, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .dark .glass-strong {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(28px) saturate(150%);
        -webkit-backdrop-filter: blur(28px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow:
          0 24px 48px -12px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      /* Glass pill / chip */
      .glass-chip {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      .dark .glass-chip {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      /* Glass secondary button */
      .glass-btn {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      .glass-btn:hover {
        background: rgba(255, 255, 255, 0.72);
      }
      .dark .glass-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .dark .glass-btn:hover {
        background: rgba(255, 255, 255, 0.09);
      }

      /* Dark glass panel — for CTA sections with white text */
      .glass-dark {
        background: rgba(16, 24, 40, 0.88);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 24px 48px -12px rgba(16, 24, 40, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .dark .glass-dark {
        background: rgba(13, 11, 24, 0.85);
        box-shadow:
          0 24px 48px -12px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      /* Specular highlight sweep on glass hover (desktop only) */
      .glass-hover-lift {
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
      }
      @media (hover: hover) {
        .glass-hover-lift:hover {
          transform: translateY(-3px);
          box-shadow:
            0 2px 4px rgba(16, 24, 40, 0.05),
            0 24px 48px -12px rgba(16, 24, 40, 0.16),
            inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .dark .glass-hover-lift:hover {
          box-shadow:
            0 24px 48px -12px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
      }
      .dark .dot-grid { opacity: 0.4; }
      .dot-grid {
        background-image: radial-gradient(circle, #101828 0.8px, transparent 0.8px);
        background-size: 26px 26px;
        opacity: 0.05;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 30%, transparent 75%);
      }
      /* Scroll reveal */
      .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22,1,0.36,1); }
      .reveal.is-visible { opacity: 1; transform: translateY(0); }
      @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1; transform: none; transition: none; }
      }

      /* Custom grid-pattern hero (subtle, no canvas) */
      .hero-lines {
        background-image:
          linear-gradient(to right, rgba(16,24,40,0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(16,24,40,0.045) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse 75% 70% at 50% 20%, black 20%, transparent 78%);
        -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 20%, black 20%, transparent 78%);
      }
      .dark .hero-lines {
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      }
    </style>
